# quickmenu - your menu lives here.
#
#   Label = command
#
# Group items with [section] headers. Settings start with a dot and attach to
# the item above them, or to the whole section if they come before any item:
#
#   .if      = <shell condition>   only show when this exits 0
#   .desc    = <words>             extra keywords for filtering
#   .group   = <name>              override the section name
#   .confirm = yes                 ask y/N before running
#   .edit    = yes                 put it on the prompt instead of running it
#
# Commands can ask for the bits they're missing:
#
#   {{prompt:Label}}                   ask for text
#   {{prompt:Label=default}}           ask, with a default
#   {{pick:some command}}              pick one line of its output
#   {{file:*.xcodeproj}}               pick a matching file or directory
#   {{dir}}                            pick a sub-directory
#   {{env:NAME}}                       an environment variable
#
# Values are shell-quoted for you. Long lines can end with \ to continue.


[open]

Launch Code          = code .
Launch Finder        = open .
Launch Xcode project = open {{file:*.xcodeproj *.xcworkspace}}
.desc                = xcode ios swift


[git]
.if = git rev-parse --is-inside-work-tree

Commit everything    = git add -A && git commit -m {{prompt:Message=Automated commit}}
Status               = git status -sb
Pull (rebase)        = git pull --rebase
Push current branch  = git push -u origin HEAD
Log (graph)          = git --no-pager log --oneline --graph --decorate -20
Switch branch        = git switch {{pick:git branch --format="%(refname:short)"}}
New branch           = git switch -c {{prompt:Branch name}}
Discard all changes  = git reset --hard && git clean -fd
.confirm             = yes
Open repo on GitHub  = gh repo view --web
Create pull request  = gh pr create --fill --web


[dev]

npm install = npm install
.if         = [[ -f package.json ]]

npm run ... = npm run {{pick:node -p "Object.keys(require('./package.json').scripts||{}).join('\n')"}}
.if         = [[ -f package.json ]]

Run tests   = npm test
.if         = [[ -f package.json ]]

Python venv = python3 -m venv .venv && source .venv/bin/activate


[shell]

Jump to directory = cd {{dir}}
Disk usage here   = du -sh * | sort -h | tail -20
Kill port         = lsof -ti tcp:{{prompt:Port=3000}} | xargs kill -9
.confirm          = yes
Reload zsh        = exec zsh
Edit this menu    = qm --edit
